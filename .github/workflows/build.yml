name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege by default; only the release job may write (to create the GitHub release).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes/PR updates are cancelled; a tag release always runs to completion.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :protocol:test :app:testDebugUnitTest

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag
        run: |
          # versionCode = MAJOR*10000 + MINOR*100 + PATCH, so MINOR and PATCH must stay below 100.
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must look like vMAJOR.MINOR.PATCH with MINOR and PATCH in 0-99"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Publish release with update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          # Base 10 explicitly: a component like "08" would otherwise be read as (invalid) octal.
          CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
          cp app/build/outputs/apk/release/app-release.apk igpsport-karoo.apk
          cp assets/icon.png icon.png
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          jq -n \
            --arg v "$VERSION" \
            --argjson c "$CODE" \
            --arg base "$BASE" \
            '{
              label: "iGPSPORT Light",
              packageName: "com.tiagodias.igpsportkaroo",
              latestApkUrl: ($base + "/igpsport-karoo.apk"),
              latestVersion: $v,
              latestVersionCode: $c,
              developer: "Tiago Dias",
              description: "Control iGPSPORT VS-series bike lights from your Karoo",
              iconUrl: ($base + "/icon.png")
            }' > manifest.json
          gh release create "$GITHUB_REF_NAME" igpsport-karoo.apk manifest.json icon.png --generate-notes
