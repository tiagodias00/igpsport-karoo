name: build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :protocol:test :app:testDebugUnitTest

      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Publish release with update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          cp app/build/outputs/apk/release/app-release.apk igpsport-karoo.apk
          cp assets/icon.png icon.png
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          NOTES="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          jq -n \
            --arg v "$VERSION" \
            --argjson c "$CODE" \
            --arg base "$BASE" \
            --arg notes "$NOTES" \
            '{
              label: "iGPSPORT Light",
              packageName: "com.tiagodias.igpsportkaroo",
              latestApkUrl: ($base + "/igpsport-karoo.apk"),
              latestVersion: $v,
              latestVersionCode: $c,
              developer: "Tiago Dias",
              description: "Control iGPSPORT VS-series bike lights from your Karoo",
              iconUrl: ($base + "/icon.png")
            } + (if ($notes | length) > 0 then { releaseNotes: $notes } else {} end)' > manifest.json
          gh release create "$GITHUB_REF_NAME" igpsport-karoo.apk manifest.json icon.png --generate-notes
